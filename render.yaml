services:
  - type: web
    name: securo-backend
    runtime: node
    buildCommand: npm ci --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.20.0
      - key: SESSION_SECRET
        generateValue: true
      - key: NEON_DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://securo-m9ei-seven.vercel.app
      - key: COOKIE_SAME_SITE
        value: none